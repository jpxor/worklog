name: Build and test WorkLog
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.paths.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: node --test scripts/ci-tests.mjs scripts/release-tests.mjs
      - run: node scripts/release.mjs
      - id: paths
        run: node scripts/ci.mjs changes >> "$GITHUB_OUTPUT"
  frontend:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run notices:check
      - run: npm run test:notices
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error
  desktop:
    # Keep the existing required check names, including for documentation-only PRs.
    name: desktop (${{ matrix.os }})
    needs: [changes, frontend]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ needs.changes.outputs.desktop == 'true' && matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/desktop
        if: needs.changes.outputs.desktop == 'true'
        with:
          package: ${{ github.event_name != 'pull_request' }}
