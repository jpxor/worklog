name: Build and test WorkLog
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.paths.outputs.desktop }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        run: node scripts/ci.mjs changes >> "$GITHUB_OUTPUT"
  frontend:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run notices:check
      - run: npm run test:notices
      - run: npm run test:release
      - run: node --test scripts/ci-tests.mjs
      - run: npm run release:check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error
  desktop:
    # Keep the existing required check names, including for documentation-only PRs.
    name: desktop (${{ matrix.os }})
    needs: [changes, frontend]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ needs.changes.outputs.desktop == 'true' && matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/desktop
        if: needs.changes.outputs.desktop == 'true'
        with:
          package: ${{ github.event_name != 'pull_request' }}
