name: Build and test WorkLog
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run tauri build -- --bundles nsis
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: npm run tauri build -- --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: WorkLog-${{ runner.os }}
          path: |
            src-tauri/target/release/worknotes.exe
            src-tauri/target/release/worknotes
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const version = JSON.parse(fs.readFileSync("package.json")).version; const tauri = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json")).version; if (process.env.RELEASE_TAG !== `v${version}` || version !== tauri) throw new Error("Release tag and app versions must match");'
      - uses: actions/download-artifact@v4
        with:
          pattern: WorkLog-*
          path: artifacts
      - name: Prepare release files
        run: |
          mkdir release
          cp artifacts/WorkLog-Windows/worknotes.exe release/WorkLog-windows-x64.exe
          cp artifacts/WorkLog-Windows/bundle/nsis/*.exe release/
          cp artifacts/WorkLog-Linux/bundle/deb/*.deb release/
          cp artifacts/WorkLog-Linux/bundle/appimage/*.AppImage release/
          chmod +x artifacts/WorkLog-Linux/worknotes
          tar -czf release/WorkLog-linux-x64.tar.gz -C artifacts/WorkLog-Linux worknotes
          cd release
          sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "WorkLog $RELEASE_TAG" --notes-file docs/release-notes.md
