name: Check and package desktop
description: Run native tests; package only trusted main or manually requested builds
inputs:
  package:
    description: Build and upload installers
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: npm
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
    - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      with:
        workspaces: src-tauri
        save-if: ${{ github.event_name != 'pull_request' }}
    - name: Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
        sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf desktop-file-utils
    - shell: bash
      run: npm ci
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: frontend-dist
        path: dist
    - shell: bash
      run: cargo test --locked --manifest-path src-tauri/Cargo.toml
    - name: Build Windows installer
      if: inputs.package == 'true' && runner.os == 'Windows'
      shell: bash
      run: npm run tauri build -- --bundles nsis --config src-tauri/tauri.ci.conf.json
    - name: Build Linux package
      if: inputs.package == 'true' && runner.os == 'Linux'
      shell: bash
      run: npm run tauri build -- --bundles deb --config src-tauri/tauri.ci.conf.json
    - name: Verify Windows installer licensing payload
      if: inputs.package == 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
        $extracted = Join-Path $env:RUNNER_TEMP 'worklog-installer'
        7z x $installer.FullName "-o$extracted" -y
        if ($LASTEXITCODE -ne 0) { throw 'Installer extraction failed' }
        node scripts/verify-distribution.mjs $extracted
    - name: Verify Linux package payload
      if: inputs.package == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        mkdir "$RUNNER_TEMP/worklog-deb"
        dpkg-deb -x src-tauri/target/release/bundle/deb/*.deb "$RUNNER_TEMP/worklog-deb"
        node scripts/verify-distribution.mjs "$RUNNER_TEMP/worklog-deb"
        desktop-file-validate "$RUNNER_TEMP/worklog-deb/usr/share/applications/local.worklog.desktop.desktop"
        test -f "$RUNNER_TEMP/worklog-deb/usr/share/icons/hicolor/128x128/apps/worklog.png"
    - name: Verify Ubuntu 24.04 install, reinstall and removal
      if: inputs.package == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        docker run --rm -e DEBIAN_FRONTEND=noninteractive -v "$PWD/src-tauri/target/release/bundle/deb:/packages:ro" ubuntu:24.04 bash -euc '
          apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y /packages/*.deb
          apt-get install --reinstall -y /packages/*.deb
          test -x /usr/bin/worklog
          test -f /usr/share/applications/local.worklog.desktop.desktop
          test -f /usr/share/icons/hicolor/128x128/apps/worklog.png
          dependencies=$(ldd /usr/bin/worklog)
          ! echo "$dependencies" | grep "not found"
          apt-get remove -y work-log
          test ! -e /usr/share/applications/local.worklog.desktop.desktop
        '
    - name: Include licensing and build provenance
      if: inputs.package == 'true'
      shell: bash
      run: |
        cp LICENSE THIRD-PARTY-NOTICES.txt src-tauri/target/release/
        cp -r third-party src-tauri/target/release/
        node scripts/ci.mjs provenance
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: inputs.package == 'true'
      with:
        name: WorkLog-${{ runner.os }}
        retention-days: 7
        if-no-files-found: error
        path: |
          src-tauri/target/release/worklog.exe
          src-tauri/target/release/worklog
          src-tauri/target/release/bundle/nsis/*.exe
          src-tauri/target/release/bundle/deb/*.deb
          src-tauri/target/release/LICENSE
          src-tauri/target/release/THIRD-PARTY-NOTICES.txt
          src-tauri/target/release/third-party/
          src-tauri/target/release/build-info.json
